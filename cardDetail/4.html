<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L.POINT 제휴사 목록 팝업</title>
  <style>
    /* Block: popup (Full-screen overlay) */
    .popup {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #fff;
      /* 흰색 배경 */
      z-index: 1000;
      overflow-y: auto;
      /* 내용이 길 경우 스크롤 가능 */
      padding-top: 20px;
    }

    /* Block: container */
    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 0 20px 80px;
      /* 하단 여백 추가 */
    }

    /* Block: grid-list */
    .grid-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      /* 3열 그리드 */
      gap: 20px 10px;
      text-align: center;
    }

    /* Block: grid-item (Logo + Text container) */
    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #333;
    }

    /* Element: grid-item__logo-box */
    .grid-item__logo-box {
      width: 100%;
      height: 60px;
      /* 로고 이미지 크기 */
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 5px;
    }

    /* Element: grid-item__logo-img (Placeholder for actual logo) */
    .grid-item__logo-img {
      /* Placeholder styling */
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #f8d4d4;
      /* 롯데 레드 계열의 배경색 */
      position: relative;
    }

    /* Modifier: grid-item__logo-img--text-logo (For H&B, Duty Free, etc. which use full text logos) */
    .grid-item__logo-img--text-logo {
      width: 100%;
      height: 30px;
      border-radius: 0;
      background-color: transparent;
      /* Placeholder for actual complex text logos */
      font-size: 14px;
      font-weight: bold;
      color: #d11d1d;
    }

    /* Element: grid-item__text */
    .grid-item__text {
      font-size: 13px;
      color: #333;
      line-height: 1.3;
    }

    /* Block: footer-info */
    .footer-info {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #f8f8f8;
      padding: 15px 20px;
      border-top: 1px solid #eee;
      box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.03);
      text-align: center;
    }

    /* Element: footer-info__text-box */
    .footer-info__text-box {
      background-color: #f1f5f9;
      /* 배경색: 이미지와 유사한 연한 회색 */
      padding: 15px;
      border-radius: 8px;
      text-align: left;
      font-size: 12px;
      color: #555;
      line-height: 1.5;
      max-width: 380px;
      /* 중앙 정렬을 위한 최대 너비 */
      margin: 0 auto;
    }
  </style>
</head>
