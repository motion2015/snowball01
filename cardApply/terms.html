<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>약관 (구조 수정)</title>
    <style>
      /* ======== 기본 스타일 리셋 ======== */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f5f7;
        color: #333;
      }

      .container {
        max-width: 440px;
        margin: 0 auto;
        padding: 16px;
        background-color: #f4f5f7;
      }

      * {
        box-sizing: border-box;
      }

      h1,
      h2 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        display: block;
      }

      details > summary h1 {
        font-size: 1.15rem;
        font-weight: 700;
        color: #111;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: #666;
      }

      /* ======== 커스텀 체크박스 스타일 ======== */
      .agree-check {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;

        width: 20px;
        height: 20px;
        border: none;
        border-radius: 0;
        background-color: transparent;

        margin-right: 12px;
        cursor: pointer;
        position: relative;
        flex-shrink: 0;
        transition: all 0.1s ease;
      }

      .agree-check::after {
        content: '';
        display: block;
        width: 5px;
        height: 10px;
        border: solid #aaa;
        border-width: 0 2px 2px 0;
        position: absolute;
        top: 4px;
        left: 7px;
        transform: rotate(45deg);
      }

      .agree-check:checked {
        background-color: transparent;
        border-color: transparent;
      }

      .agree-check:checked::after {
        border-color: #007bff;
      }

      .container > details > summary > .agree-check {
        width: 22px;
        height: 22px;
      }

      .container > details > summary > .agree-check::after {
        width: 6px;
        height: 12px;
        top: 5px;
        left: 8px;
      }

      /* ======== <details> 태그 스타일 ======== */
      details {
        background-color: #fff;
        border-bottom: 1px solid #eee;
      }

      .container > details:first-of-type {
        border-top: 1px solid #eee;
      }

      /* ======== <summary> 태그 스타일 ======== */
      summary {
        display: flex;
        align-items: center;
        padding: 18px 40px 18px 16px;
        cursor: pointer;
        list-style: none;
        position: relative;
      }

      summary::-webkit-details-marker {
        display: none;
      }

      summary:focus {
        outline: 2px solid #007bff;
        outline-offset: -2px;
      }

      summary > label {
        cursor: pointer;
      }

      /* 2차 Depth (L2) summary 들여쓰기 */
      .container > details > .content > details > summary {
        padding-left: 32px;
      }

      /* [신규] 3차 Depth (L3) summary 들여쓰기 */
      .container > details > .content > details > .content > details > summary {
        padding-left: 48px; /* 32px + 16px */
      }

      /* ======== 커스텀 아이콘 (::after) ======== */
      details:not(.empty) > summary::after {
        content: '';
        display: inline-block;
        width: 8px;
        height: 8px;
        border-bottom: 2px solid #555;
        border-right: 2px solid #555;
        transform: rotate(45deg);
        transition: transform 0.2s ease-in-out;
        position: absolute;
        right: 18px;
        top: 50%;
        margin-top: -6px;
      }

      details[open]:not(.empty) > summary::after {
        transform: rotate(-135deg);
        margin-top: -3px;
      }

      details.empty > summary::after {
        content: '❯';
        font-size: 1rem;
        color: #888;
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
      }

      /* ======== .content (내용 영역) 스타일 ======== */
      .content {
        background-color: #f9f9f9;
        padding: 16px 24px;
        border-top: 1px solid #eee;
      }

      /* L1 content (L2의 래퍼) */
      .container > details > .content {
        padding: 0;
        background-color: #fff;
        border-top: none;
      }

      /* L2 content (L3의 래퍼) */
      .container > details > .content > details > .content {
        padding-left: 40px; /* L2 summary (32px) 보다 좀 더 들어가게 */
      }

      /* L3 content (e.g. L3를 열었을 때의 내용) */
      .container
        > details
        > .content
        > details
        > .content
        > details
        > .content {
        padding-left: 56px; /* 40px + 16px */
      }

      /* ======== "자세히 보기" 링크 스타일 ======== */
      .details-link {
        display: block;
        text-align: right;
        padding: 8px 0 0 0; /* 기본 패딩 (content 내부 기준) */
        font-size: 0.9rem;
        color: #555;
        text-decoration: none;
        background-color: transparent; /* 배경색은 부모를 따름 */
      }

      /* L2 content 내의 p, details-link 간격 조정 */
      .content > p + .details-link,
      .content > details + .details-link {
        padding-top: 8px;
      }
      .content > .details-link + details {
        margin-top: 8px;
      }

      /* L2 content의 마지막 요소가 "자세히 보기"일 경우 하단 패딩 */
      .content > .details-link:last-child {
        padding-bottom: 16px;
      }

      /* L2 content에 "자세히 보기"만 있을 경우(L3) */
      .container > details > .content > details > .content > .details-link {
        padding: 8px 0 16px 0; /* 상하 패딩 추가 */
      }
    </style>
  </head>

  <body>
    <div class="container">
      <details role="region" aria-labelledby="terms-heading-1" open>
        <summary>
          <input
            type="checkbox"
            class="agree-check"
            id="check-terms-1"
            onclick="event.stopPropagation()"
          />
          <label for="check-terms-1">
            <h1 id="terms-heading-1">약관 등에 관한 동의</h1>
          </label>
        </summary>
        <div class="content">
          <details role="region" aria-labelledby="terms-heading-2" open>
            <summary>
              <input
                type="checkbox"
                class="agree-check"
                id="check-terms-2"
                onclick="event.stopPropagation()"
              />
              <label for="check-terms-2">
                <h2 id="terms-heading-2">
                  [필수]신용카드 개인회원 약관 및 부속 약관
                </h2>
              </label>
            </summary>
            <div class="content">
              <p>
                개인신용카드 발급 및 이용과 관련하여 귀사의 신용카드 개인회원
                약관 및 부속약관에 동의합니다.
              </p>

              <details
                class="empty"
                role="region"
                aria-labelledby="terms-heading-3"
              >
                <summary>
                  <input
                    type="checkbox"
                    class="agree-check"
                    id="check-terms-3"
                    onclick="event.stopPropagation()"
                  />
                  <label for="check-terms-3">
                    <h2 id="terms-heading-3">신용카드 개인회원 약관</h2>
                  </label>
                </summary>
              </details>
              <a href="#" class="details-link" onclick="event.preventDefault()"
                >자세히 보기 ❯</a
              >

              <details
                class="empty"
                role="region"
                aria-labelledby="terms-heading-4"
              >
                <summary>
                  <input
                    type="checkbox"
                    class="agree-check"
                    id="check-terms-4"
                    onclick="event.stopPropagation()"
                  />
                  <label for="check-terms-4">
                    <h2 id="terms-heading-4">신용카드 개인회원 부속약관</h2>
                  </label>
                </summary>
              </details>
              <a href="#" class="details-link" onclick="event.preventDefault()"
                >자세히 보기 ❯</a
              >
            </div>
          </details>

          <details role="region" aria-labelledby="terms-heading-5" open>
            <summary>
              <input
                type="checkbox"
                class="agree-check"
                id="check-terms-5"
                onclick="event.stopPropagation()"
              />
              <label for="check-terms-5">
                <h2 id="terms-heading-5">
                  [필수]신용카드 금융소비자의 권익에 관한 중요사항
                </h2>
              </label>
            </summary>
            <div class="content">
              <p>금융소비자의 권익에 관한 중요사항입니다.</p>
              <a href="#" class="details-link" onclick="event.preventDefault()"
                >자세히 보기 ❯</a
              >
            </div>
          </details>
        </div>
      </details>
    </div>
  </body>
</html>
