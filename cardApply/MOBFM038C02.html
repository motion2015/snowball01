<body>
  <div class="app">
    <!-- 공통 HEADER inject -->
    <inject file="/components/header.html" label="카드 Header Label" type="process" />

    <!-- Main Content -->
    <main id="shcMainContent" class="shc-main">
      <section class="shc-section">
        <h1 class="headline--s mb--4xl">원하는 상담 내용을<br>
          선택해주세요.</h1>

        <div class="shc-select-btn-group direction-col mb--4xl" role="radiogroup">
          <div class="shc-select-btn">
            <input type="radio" id="survey__question-4-01" name="inquiry_type" value="expired" />
            <label for="survey__question-4-01" class="shc-select-btn__label">
              <span class="shc-select-btn__text">신한카드의 유효기간이 지났어요</span>
            </label>
          </div>

          <div class="shc-select-btn">
            <input type="radio" id="survey__question-4-02" name="inquiry_type" value="new" />
            <label for="survey__question-4-02" class="shc-select-btn__label">
              <span class="shc-select-btn__text">신한카드를 처음 발급해요</span>
            </label>
          </div>

          <div class="shc-select-btn">
            <input type="radio" id="survey__question-4-02" name="inquiry_type" value="other" />
            <label for="survey__question-4-02" class="shc-select-btn__label">
              <span class="shc-select-btn__text">둘 다 해당되지 않아요</span>
            </label>
          </div>
        </div>
        <ul class="shc-ul style-b mb--4xl">
          <li>고객님의 간단한 인적사항을 남기면 신한카드 상담직원이 카드 신청을 돕기 위해 전화를 드려요.</li>
        </ul>
      </section>
      <section class="shc-cta-area bottom-fixed--mobile">
        <div class="shc-btn-group">
          <button type="button" class="shc-btn theme-primary size-xl" onclick="gfn_layered.open('TCM116', event)"
            id="nextButton">
            <span class="shc-btn__text">다음</span>
          </button>
        </div>

      </section>

    </main>

    <!-- 공통 FOOTER inject -->
    <inject file="/components/footer.html" />

  </div>
  <script>
    function initInquiryNextButtonBefore() {
        const nextButton = document.getElementById('nextButton');

        if (nextButton) {
          nextButton.addEventListener('click', function (event) {
            const selectedOption = document.querySelector('input[name="inquiry_type"]:checked');

            if (selectedOption) {
              const selectedValue = selectedOption.value;
              if (selectedValue === 'other') {
                gfn_layered.open('TCM116', event);
              } else if (selectedValue === 'expired' || selectedValue === 'new') {
                window.location.href = 'https://www.naver.com';
              }
            } else {
              //alert('원하는 상담 내용을 선택해주세요.');
            }
          });
        }
      }

    function initInquiryNextButton() {
        const nextButton = document.getElementById('nextButton');
        const inquiryRadios = document.querySelectorAll('input[name="inquiry_type"]');

        if (nextButton && inquiryRadios.length > 0) {
          const selectedOptionOnLoad = document.querySelector('input[name="inquiry_type"]:checked');

          if (!selectedOptionOnLoad) {
            nextButton.disabled = true;
          }

          inquiryRadios.forEach(function (radio) {
            radio.addEventListener('change', function () {
              nextButton.disabled = false;
            });
          });

          nextButton.addEventListener('click', function (event) {
            const selectedOption = document.querySelector('input[name="inquiry_type"]:checked');

            if (selectedOption) {
              const selectedValue = selectedOption.value;

              if (selectedValue === 'other') {
                gfn_layered.open('TCM116', event);
              } else if (selectedValue === 'expired' || selectedValue === 'new') {
                window.location.href = 'https://www.naver.com';
              }
            }
          });
        }
      }
    ScriptHub.onReady('core', function () {
        initInquiryNextButton();
      });




  </script>
</body>
