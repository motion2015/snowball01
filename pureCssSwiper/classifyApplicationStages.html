<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신청자격 확인</title>
  <style>
    /* Inter 폰트 (선택 사항) */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    /* 기본 스타일 초기화 및 설정 */
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f3f4f6;
      /* bg-gray-100 */
    }

    /* JavaScript로 숨길/보일 요소에 대한 기본 클래스 */
    .hidden {
      display: none;
    }

    /* 메인 컨테이너 */
    .container {
      width: 100%;
      max-width: 448px;
      /* max-w-md */
      padding: 32px;
      /* p-8 */
      background-color: #ffffff;
      /* bg-white */
      border-radius: 8px;
      /* rounded-lg */
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      /* shadow-lg */
      box-sizing: border-box;
      /* 패딩이 너비에 포함되도록 */
    }

    /* 컨테이너 내의 요소 간 기본 간격 */
    .container>*+* {
      margin-top: 24px;
      /* space-y-6 */
    }

    /* 섹션 1: 입력 폼 */
    #rrn-input-section h1 {
      font-size: 1.5rem;
      /* text-2xl */
      font-weight: 700;
      /* font-bold */
      text-align: center;
      /* text-center */
      color: #1f2937;
      /* text-gray-800 */
    }

    #rrn-input-section p {
      text-align: center;
      /* text-center */
      color: #6b7280;
      /* text-gray-500 */
      margin-top: 8px;
    }

    .form-group {
      margin-top: 24px;
      /* mt-6 */
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      /* text-sm */
      font-weight: 500;
      /* font-medium */
      color: #374151;
      /* text-gray-700 */
    }

    .input-group {
      display: flex;
      align-items: center;
      margin-top: 8px;
      /* mt-2 */
      gap: 8px;
      /* space-x-2 */
    }

    .input-group input[type="tel"] {
      width: 50%;
      /* w-1/2 */
      padding: 8px 12px;
      /* px-3 py-2 */
      text-align: center;
      /* text-center */
      border: 1px solid #d1d5db;
      /* border border-gray-300 */
      border-radius: 6px;
      /* rounded-md */
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      /* shadow-sm */
      box-sizing: border-box;
      -moz-appearance: textfield;
      /* Firefox에서 숫자 화살표 숨기기 */
    }

    /* input[type="tel"]::-webkit-outer-spin-button,
        input[type="tel"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        } */

    .input-group input[type="tel"]:focus {
      outline: 2px solid transparent;
      outline-offset: 2px;
      border-color: #3b82f6;
      /* focus:border-blue-500 */
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
      /* focus:ring-blue-500 */
    }

    .input-group span {
      font-size: 1.25rem;
      /* text-xl */
      color: #9ca3af;
      /* text-gray-400 */
    }

    /* 오류 메시지 */
    #error-message {
      margin-top: 16px;
      /* mt-4 */
      font-size: 0.875rem;
      /* text-sm */
      font-weight: 500;
      /* font-medium */
      text-align: center;
      /* text-center */
      color: #dc2626;
      /* text-red-600 */
    }

    /* 확인 버튼 */
    #check-button {
      width: 100%;
      padding: 12px 16px;
      /* px-4 py-3 */
      margin-top: 24px;
      /* mt-6 */
      font-weight: 600;
      /* font-semibold */
      color: #ffffff;
      /* text-white */
      background-color: #2563eb;
      /* bg-blue-600 */
      border: none;
      border-radius: 6px;
      /* rounded-md */
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
    }

    #check-button:hover {
      background-color: #1d4ed8;
      /* hover:bg-blue-700 */
    }

    #check-button:focus {
      outline: 2px solid transparent;
      outline-offset: 2px;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.4);
      /* focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 */
    }

    /* 섹션 2 & 3: 결과 섹션 공통 스타일 */
    .result-section {
      padding: 24px;
      /* p-6 */
      border: 1px solid;
      border-radius: 8px;
      /* rounded-lg */
    }

    .result-section h2 {
      font-size: 1.25rem;
      /* text-xl */
      font-weight: 600;
      /* font-semibold */
    }

    .result-section p {
      margin-top: 8px;
      /* mt-2 */
      color: #374151;
      /* text-gray-700 */
    }

    .result-section ul {
      margin-top: 16px;
      /* mt-4 */
      margin-left: 20px;
      /* ml-5 */
      list-style-type: decimal;
      /* list-decimal */
      color: #4b5563;
      /* text-gray-600 */
    }

    .result-section ul li+li {
      margin-top: 8px;
      /* space-y-2 */
    }

    .btn-reset {
      width: 100%;
      padding: 8px 16px;
      /* px-4 py-2 */
      margin-top: 24px;
      /* mt-6 */
      font-weight: 500;
      /* font-medium */
      background-color: #ffffff;
      /* bg-white */
      border: 1px solid;
      border-radius: 6px;
      /* rounded-md */
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
    }

    /* 섹션 2: 내국인 */
    #local-step {
      background-color: #eff6ff;
      /* bg-blue-50 */
      border-color: #bfdbfe;
      /* border-blue-200 */
    }

    #local-step h2 {
      color: #1e40af;
    }

    /* text-blue-800 */
    #local-step .btn-reset {
      color: #1d4ed8;
      /* text-blue-700 */
      border-color: #2563eb;
      /* border-blue-600 */
    }

    #local-step .btn-reset:hover {
      background-color: #dbeafe;
    }

    /* hover:bg-blue-50 */

    /* 섹션 3: 외국인 */
    #foreign-step {
      background-color: #f0fdf4;
      /* bg-green-50 */
      border-color: #bbf7d0;
      /* border-green-200 */
    }

    #foreign-step h2 {
      color: #166534;
    }

    /* text-green-800 */
    #foreign-step .btn-reset {
      color: #15803d;
      /* text-green-700 */
      border-color: #16a34a;
      /* border-green-600 */
    }

    #foreign-step .btn-reset:hover {
      background-color: #dcfce7;
    }

    /* hover:bg-green-50 */
  </style>
</head>

<body>

  <div class="container">

    <!-- 섹션 1: 주민등록번호 입력 폼 -->
    <div id="rrn-input-section">
      <h1>신청 자격 확인</h1>
      <p>주민등록번호를 입력하여 신청 단계를 확인하세요.</p>

      <div class="form-group">
        <label for="rrn-front">주민등록번호</label>
        <div class="input-group">
          <!-- 앞 6자리 입력 -->
          <input type="tel" id="rrn-front" name="rrn-front" maxlength="6" placeholder="앞 6자리"
            oninput="moveToNext(this, 'rrn-back', 6)">

          <span>-</span>

          <!-- 뒤 7자리 입력 -->
          <input type="tel" id="rrn-back" name="rrn-back" maxlength="7" placeholder="뒤 7자리">
        </div>
      </div>

      <!-- 오류 메시지 표시 영역 -->
      <div id="error-message" class="hidden"></div>

      <button id="check-button">확인하기</button>
    </div>

    <!-- 섹션 2: 내국인 신청 단계 (초기 숨김) -->
    <div id="local-step" class="result-section hidden">
      <h2>내국인 신청 단계</h2>
      <p>내국인으로 확인되었습니다. 아래 절차에 따라 신청을 계속해 주세요.</p>
      <ul>
        <li>1. 본인인증 (휴대폰 또는 공동인증서)</li>
        <li>2. 신청서 약관 동의</li>
        <li>3. 상세 정보 입력</li>
        <li>4. 신청 완료</li>
      </ul>
      <button onclick="resetForm()" class="btn-reset">
        처음으로 돌아가기
      </button>
    </div>

    <!-- 섹션 3: 외국인 신청 단계 (초기 숨김) -->
    <div id="foreign-step" class="result-section hidden">
      <h2>외국인 신청 단계</h2>
      <p>외국인으로 확인되었습니다. 아래 절차에 따라 신청을 계속해 주세요.</p>
      <ul>
        <li>1. 외국인등록번호 및 여권 확인</li>
        <li>2. 체류 자격 증빙</li>
        <li>3. 신청서 약관 동의</li>
        <li>4. 신청 완료</li>
      </ul>
      <button onclick="resetForm()" class="btn-reset">
        처음으로 돌아가기
      </button>
    </div>

  </div>

  <script>
    // DOM 요소 가져오기
    const rrnFront = document.getElementById('rrn-front');
    const rrnBack = document.getElementById('rrn-back');
    const checkButton = document.getElementById('check-button');
    const errorMessage = document.getElementById('error-message');

    const rrnInputSection = document.getElementById('rrn-input-section');
    const localStepSection = document.getElementById('local-step');
    const foreignStepSection = document.getElementById('foreign-step');

    // 앞자리 입력 시 뒷자리로 자동 포커스 이동
    function moveToNext(currentInput, nextInputId, maxLength) {
      // 숫자만 입력되도록 강제 (선택 사항)
      // currentInput.value = currentInput.value.replace(/[^0-9]/g, '');

      if (currentInput.value.length >= maxLength) {
        document.getElementById(nextInputId).focus();
      }
    }

    // rrn-back 입력 필드에도 숫자만 입력되도록 이벤트 리스너 추가 (선택 사항)
    // rrnBack.addEventListener('input', (e) => {
    //     e.target.value = e.target.value.replace(/[^0-9]/g, '');
    // });

    // 확인 버튼 클릭 이벤트 리스너
    checkButton.addEventListener('click', () => {
      const frontValue = rrnFront.value;
      const backValue = rrnBack.value;

      // 유효성 검사 (1): 길이 확인
      if (frontValue.length !== 6 || backValue.length !== 7) {
        showError('주민등록번호 13자리를 정확히 입력해 주세요.');
        return;
      }

      // 유효성 검사 (2): 숫자 확인 (이미 input에서 제어할 수도 있지만, 이중 체크)
      if (!/^[0-9]+$/.test(frontValue) || !/^[0-9]+$/.test(backValue)) {
        showError('숫자만 입력해 주세요.');
        return;
      }

      // 뒷자리의 첫 번째 숫자 추출
      const firstDigitOfBack = backValue.charAt(0); // 또는 backValue[0]

      // 에러 메시지 숨기기
      hideError();

      // 입력 폼 숨기기
      rrnInputSection.classList.add('hidden');

      // 로직 판별 및 적합한 화면 노출
      if (['1', '2', '3', '4'].includes(firstDigitOfBack)) {
        // 내국인
        localStepSection.classList.remove('hidden');
      } else if (['5', '6', '7', '8'].includes(firstDigitOfBack)) {
        // 외국인
        foreignStepSection.classList.remove('hidden');
      } else {
        // 그 외 (유효하지 않은 번호)
        rrnInputSection.classList.remove('hidden'); // 다시 입력 폼 보여주기
        showError('유효하지 않은 주민등록번호 뒷자리입니다.');
      }
    });

    // Enter 키로 '확인하기' 버튼 클릭 (편의 기능)
    function handleKeydown(event) {
      if (event.key === 'Enter') {
        // 현재 rrn-back에 포커스가 있을 때만 Enter 키로 확인
        if (document.activeElement === rrnBack) {
          checkButton.click();
        }
      }
    }

    rrnFront.addEventListener('keydown', handleKeydown);
    rrnBack.addEventListener('keydown', handleKeydown);

    // 에러 메시지 표시 함수
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
    }

    // 에러 메시지 숨기기 함수
    function hideError() {
      errorMessage.textContent = '';
      errorMessage.classList.add('hidden');
    }

    // '처음으로' 버튼 클릭 시 폼 리셋
    function resetForm() {
      // 입력값 초기화
      rrnFront.value = '';
      rrnBack.value = '';

      // 에러 메시지 숨기기
      hideError();

      // 섹션 숨기기/표시
      localStepSection.classList.add('hidden');
      foreignStepSection.classList.add('hidden');
      rrnInputSection.classList.remove('hidden');

      // 포커스
      rrnFront.focus();
    }

  </script>
</body>

</html>
